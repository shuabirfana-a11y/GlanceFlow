[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glanceflow"
version = "0.1.0"
description = "Trusted action compilation safety gate for campus notices"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--basetemp=work/pytest-temp"]
