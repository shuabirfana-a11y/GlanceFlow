<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlanceFlow Competition Demo</title><link rel="stylesheet" href="/styles.css"></head>
<body><span hidden>眼镜交互模拟器</span><main class="shell"><header><div><h1>GlanceFlow</h1><p>First-Person Trusted Action Agent</p></div><span class="badge">LOCAL WINDOWS SIMULATION · OFFLINE</span></header>
<nav><select id="scenario"></select><button id="load">加载场景</button><button id="step">下一步</button><button id="auto" class="primary">自动演示</button><button id="reset">重置</button><label><input id="bbox" type="checkbox"> OCR BBox</label></nav>
<section class="hero"><article class="vision"><h2>第一视角视觉画面</h2><img id="poster" alt="场景通知"><div id="bboxLayer"></div><p id="frame">等待加载证据帧</p></article><article class="hud"><small>GLASSES HUD</small><h2 id="hudTitle">见程已就绪</h2><p id="hudBody">选择一个比赛场景</p><button id="confirm">确认 / 仍然创建</button></article></section>
<section class="cards"><article><h3>Agent Decision</h3><dl id="decision"></dl></article><article><h3>Evidence</h3><div id="evidence">尚无证据</div></article><article><h3>Safety</h3><div id="safety" class="checks"></div></article><article id="transactionCard" hidden><h3>Transaction</h3><div id="transaction"></div></article></section>
<details><summary>技术步骤与本地性能</summary><div id="steps"></div><pre id="latency"></pre></details><footer>所有时间均来自本地 Windows CPU 仿真；不是 Rokid 真机延迟。无 Google API、网络 LLM 或真实日历写入。</footer></main><script src="/app.js" defer></script></body></html>
